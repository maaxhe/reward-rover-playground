[build]
command = "npm run build"
publish = "dist"

# Proxy /api/* to the backend so the browser never makes a cross-origin request
[[redirects]]
  from = "/api/*"
  to = "https://rl-agent.maximleopold.com/api/:splat"
  status = 200
  force = true

# Single-page app: deep links like /klasse (QR codes!) and /admin must serve index.html.
# Must stay below the /api rule, which is matched first.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
